<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NetPulse</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #020617; color: #e2e8f0; font-family: "Segoe UI", sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 40px rgba(56, 189, 248, 0.25); }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; }
    p { margin: 0; color: #94a3b8; font-size: 13px; }
    .bar { width: 180px; height: 4px; border-radius: 999px; background: #1e293b; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #38bdf8, #a78bfa); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <main>
    <img src="mark.png" alt="" />
    <h1>NetPulse</h1>
    <p>Starting the LAN analyzer</p>
    <div class="bar" role="progressbar" aria-label="Loading"><span></span></div>
  </main>
</body>
</html>
